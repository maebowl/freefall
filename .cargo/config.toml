# WASM build configuration.
#
# getrandom 0.3 (via rand_core) and 0.4 (via uuid) both select their browser
# backend from this cfg. The matching `wasm_js` Cargo feature is enabled in
# Cargo.toml; this flag is the other half getrandom 0.3+ requires. Only applied
# when building for wasm — native builds are unaffected.
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']
