[package]
name = "freefall"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.18", features = ["bevy_debug_stepping", "mp3"] }
avian2d = "0.5"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = { version = "0.3", features = ["wasm_js"] }

[features]
# Embed all assets into the binary for a standalone native build. Off by default
# so `cargo run` / `cargo run --release` load assets from disk and pick up edited
# level art immediately (wasm always embeds regardless). Standalone native build:
#   cargo build --release --features embed
# Kept optional so bevy_embedded_assets isn't compiled in disk mode — that avoids
# it embedding (and choking on) files that build.rs prunes later in the build.
embed = ["dep:bevy_embedded_assets"]

[target.'cfg(not(target_family = "wasm"))'.dependencies]
ureq = { version = "3", features = ["json"] }
bevy_embedded_assets = { version = "0.15", optional = true }

[target.wasm32-unknown-unknown.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
bevy_embedded_assets = "0.15"

# Optimize dependencies in dev builds for playable performance
[profile.dev.package."*"]
opt-level = 2
